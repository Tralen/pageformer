# Template for the technical report example.
#
# It lives in its own directory, so it replaces the shared template of the
# parent folder. Without a letterhead, both margins are free for the running
# header and footer.

version: "0.7"

page:
  size: a4
  orientation: portrait
  margins:
    top: 25mm
    bottom: 25mm
    left: 25mm
    right: 25mm
  # A light blue paper, visible without a letterhead.
  background: "#f4f8fc"
  header:
    left: "{author}"
    center: "{title}"
    right: "Page {page} of {pages}"
  footer:
    left: "Demonstration document"
    right: "Pageformer"

formatting:
  paragraph:
    font_families:
      - Liberation Serif
      - DejaVu Serif
    size: 11
    leading: 7
    spacing: 10
    # Inline styles inherit this face; code declares monospace explicitly.
    # Monospace has a larger x-height, so it uses 0.875 of the body size.
    code:
      font_families:
        - Liberation Mono
        - DejaVu Sans Mono
      size: 9.5
      foreground: "#7a2a5a"
      background: "#f2eef6"
    strikethrough:
      foreground: "#7a2a2a"
    link:
      foreground: "#336699"
      underline: true
  quote:
    foreground: "#2a4d7a"
    background: "#f7fafd"
    border:
      left: 3pt
      color: "#336699"
      padding: 8
  code_block:
    font_families:
      - Liberation Mono
      - DejaVu Sans Mono
    size: 9.5
    background: "#f4f4f4"
    border:
      top: 0.5pt
      bottom: 0.5pt
      color: "#999999"
      padding: 6
  image:
    alignment: center
    max_width: 100%
    background: "#ffffff"
    border:
      top: 1pt
      right: 1pt
      bottom: 1pt
      left: 1pt
      color: "#336699"
      padding: 6
  list:
    indent: 0.7cm
    marker_gap: 0.5cm
    alignment: left
    foreground: "#334455"
    background: "#f5f7fa"
    bullet:
      - "•"
      - "–"
    numbering:
      format:
        - decimal
        - lower-alpha
      suffix: "."
    task:
      gap: 1
      bullet: false
      done:
        marker: "[x]"
        foreground: "#2f7d32"
        weight: bold
      todo:
        marker: "[ ]"
        foreground: "#666666"
  heading:
    font_families:
      - Liberation Sans
      - DejaVu Sans
    weight: bold
    spacing_before: 18
    spacing_after: 6
    # Every level inherits this rule, unless it clears it with `none`.
    rule:
      thickness: 0.75pt
      color: "#336699"
      spacing_before: 3
    h1:
      size: 18
      spacing_before: 0
      spacing_after: 12
      page_break_before: true
      # A solid bar across the text width, in the table header color.
      background: "#e8eef5"
      # The bar replaces the rule on this level.
      rule: none
    h2:
      size: 14
      spacing_before: 16
      spacing_after: 6
    h3:
      size: 12
      spacing_before: 12
      spacing_after: 4

  table:
    border: 0.5pt
    border_color: "#336699"
    header_fill: "#e8eef5"
    cell_padding: 6pt
