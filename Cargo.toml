[package]
name = "pageformer"
version = "0.23.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Generates documents from Markdown and a YAML template."
publish = false

[dependencies]
anyhow = "1.0.104"
clap = "4.6.7"
pulldown-cmark = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
typst = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"

[dev-dependencies]
proptest = "1.12.0"
roxmltree = "0.21.2"
tempfile = "3.27.0"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[profile.dev]
# Line tables keep backtraces useful without the full debug bloat.
debug = 1
# Each test run links a large binary that includes Typst; the incremental
# state adds gigabytes and little benefit in a crate this size.
incremental = false

[profile.dev.package."*"]
# Dependencies, chiefly Typst, carry no debug info; they are not debugged here.
debug = false

[profile.release]
lto = "thin"
strip = "symbols"
