# Example template shared by the Markdown files in this directory.
#
# The nearest `.pageformer.yaml` wins entirely; there is no merge across
# directories. This file applies to Contrato.md and Embargos.md.
# Lengths without a unit are points; `leading` is a multiplier of the font size.

version: 3

page:
  size: a4
  orientation: portrait
  margins:
    top: 85
    bottom: 85
    left: 85
    right: 57
  # A letterhead resolves relative to this file.
  letterhead: Timbre.png

text:
  body:
    font_families:
      - Liberation Serif
      - DejaVu Serif
      - Libertinus Serif
    size: 12
  title:
    font_families:
      - Liberation Sans
      - DejaVu Sans
      - Libertinus Serif
    size: 18
  leading: 0.65
  paragraph_spacing: 24
  header_spacing: 18
  alignment: justified
