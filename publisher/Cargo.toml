[package]
name = "pageformer-publisher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The minimal graphical converter for Pageformer documents."
publish = false

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "x11"] }
pageformer = { path = ".." }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.17.2", default-features = false }
