[package]
name = "pageformer"
version = "0.2.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Generates documents from Markdown and a YAML template."
publish = false

[dependencies]
anyhow = "1.0.104"
clap = "4.6.7"
pulldown-cmark = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = "symbols"
