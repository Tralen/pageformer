# Example template shared by the Markdown files in this directory.
#
# The nearest `.pageformer.yaml` wins entirely; there is no merge across
# directories. This file applies to Contrato.md and Embargos.md.
# Lengths accept mm, cm, in or pt; a number without a unit is points.

version: "0.5"

page:
  size: a4
  orientation: portrait
  margins:
    top: 30mm
    bottom: 30mm
    left: 30mm
    right: 25mm
  # A letterhead resolves relative to this file.
  letterhead: Timbre.png

formatting:
  paragraph:
    font_families:
      - Liberation Serif
      - DejaVu Serif
      - Linux Libertine O
    size: 12
    weight: normal
    style: normal
    leading: 8
    spacing: 24
    alignment: justified
    emphasis:
      style: italic
    strong:
      weight: bold
  heading:
    font_families:
      - Liberation Sans
      - DejaVu Sans
      - Linux Biolinum O
    weight: bold
    style: normal
    spacing_before: 36
    spacing_after: 12
    h1:
      size: 20
      spacing_before: 48
    h2:
      size: 18
    h3:
      size: 16
    h4:
      size: 14
    h5:
      size: 13
    h6:
      size: 12
