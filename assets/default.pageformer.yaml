# Pageformer fallback template, embedded in the binary.
#
# A local `.pageformer.yaml` replaces this file entirely: there is no merge.
# The schema version is an integer and must be the one this build supports.
version: 1

document:
  language: pt-BR

page:
  size: a4
  orientation: portrait
  margins:
    top: 25mm
    bottom: 20mm
    left: 25mm
    right: 20mm

text:
  font_families:
    - Liberation Serif
    - DejaVu Serif
  size: 12pt
  leading: 0.65
  alignment: justified
