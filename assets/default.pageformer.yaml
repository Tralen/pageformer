# Pageformer fallback template, embedded in the binary.
#
# A local `.pageformer.yaml` replaces this file entirely: there is no merge.
# The schema version is an integer and must be the one this build supports.
# Lengths accept mm, cm, in or pt; a number without a unit is points.
version: 4

page:
  size: a4
  orientation: portrait
  margins:
    top: 71
    bottom: 57
    left: 71
    right: 57

text:
  body:
    font_families:
      - Liberation Serif
      - DejaVu Serif
      - Libertinus Serif
    size: 12
  title:
    font_families:
      - Liberation Sans
      - DejaVu Sans
      - Libertinus Serif
    size: 18
  leading: 7.8pt
  alignment: justified
