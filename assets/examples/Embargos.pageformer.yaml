# Example template for Embargos.md.
#
# Copy it to `.pageformer.yaml` next to the Markdown to have it discovered
# automatically, or pass it explicitly:
#
#   pageformer --template assets/examples/Embargos.pageformer.yaml Embargos.md
#
# The nearest `.pageformer.yaml` replaces the global template and the embedded
# fallback entirely; there is no merge.

version: 2

page:
  size: a4
  orientation: portrait
  margins:
    top: 30mm
    bottom: 20mm
    left: 30mm
    right: 20mm
  # A letterhead resolves relative to this file.
  # letterhead: letterhead.png

text:
  font_families:
    - Liberation Serif
    - DejaVu Serif
    - Libertinus Serif
  size: 12pt
  leading: 1.25
  alignment: justified
