# Pageformer fallback template, embedded in the binary.
#
# A local `.pageformer.yaml` replaces this file entirely: there is no merge.
# The schema version is a string with the form `major.minor`.
# Lengths accept mm, cm, in or pt; a number without a unit is points.
version: "0.5"

page:
  size: a4
  orientation: portrait
  margins:
    top: 71
    bottom: 57
    left: 71
    right: 57

formatting:
  paragraph:
    font_families:
      - Liberation Serif
      - DejaVu Serif
      - Libertinus Serif
    size: 12
    weight: normal
    style: normal
    leading: 7.8
    alignment: justified
    emphasis:
      style: italic
    strong:
      weight: bold
    # Every inline style inherits this face; code declares monospace explicitly,
    # so the different font is visible in the template and not a hidden default.
    code:
      font_families:
        - Liberation Mono
        - DejaVu Sans Mono
  code_block:
    font_families:
      - Liberation Mono
      - DejaVu Sans Mono
  heading:
    font_families:
      - Liberation Sans
      - DejaVu Sans
      - Libertinus Serif
    weight: bold
    style: normal
    spacing_before: 18
    spacing_after: 6
    h1:
      size: 18
    h2:
      size: 14
      spacing_before: 12
      spacing_after: 4
    h3:
      size: 12
      spacing_before: 10
      spacing_after: 4
    h4:
      size: 12
      spacing_before: 8
      spacing_after: 2
    h5:
      size: 12
      spacing_before: 8
      spacing_after: 2
    h6:
      size: 12
      spacing_before: 8
      spacing_after: 2
